# The single Zhuangzi line in the rotation.
#
# Verified 2026-09-10 in the same Internet Archive scan of Sacred Books of the
# East Vol. 39 (identifier wg939) used for the Tao Te Ching entry. It opens
# Book III, which Legge titles "Yang Shang Ku, or Nourishing the Lord of Life":
#
#   "1. There is a limit to our life, but to knowledge there is no limit. With
#   what is limited to pursue after what is unlimited is a perilous thing..."
#
# The pool prints the first clause only, verbatim.
